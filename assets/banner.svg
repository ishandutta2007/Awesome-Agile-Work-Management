<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #a855f7; }

      /* Dynamic pulse animation */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes progressAnim {
        0% { stroke-dashoffset: 280; }
        50% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 280; }
      }

      .animated-bg-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 200px 100px; }
      .animated-bg-2 { animation: pulseGlow 8s ease-in-out infinite 1s; transform-origin: 1000px 280px; }
      .floating-card-1 { animation: floatCard 5s ease-in-out infinite; }
      .floating-card-2 { animation: floatCard 6s ease-in-out infinite 1.5s; }
      .progress-line { stroke-dasharray: 280; animation: progressAnim 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>

  <!-- Dynamic Glowing Orbs in Background (Does not obscure text) -->
  <circle class="animated-bg-1" cx="150" cy="80" r="140" fill="#4f46e5" opacity="0.3" filter="url(#glow)"/>
  <circle class="animated-bg-2" cx="1050" cy="280" r="160" fill="#c026d3" opacity="0.25" filter="url(#glow)"/>

  <!-- Background Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
  </g>

  <!-- Right Side Decorative Agile Kanban/Sprint Cards (Positioned safely away from text) -->
  <g class="floating-card-1" transform="translate(820, 50)">
    <rect width="320" height="110" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    <rect x="20" y="20" width="80" height="8" rx="4" fill="#a855f7"/>
    <rect x="20" y="38" width="220" height="10" rx="5" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="20" y="56" width="160" height="8" rx="4" fill="#94a3b8" fill-opacity="0.5"/>
    <!-- Progress Indicator -->
    <circle cx="280" cy="55" r="22" fill="none" stroke="#334155" stroke-width="4"/>
    <circle cx="280" cy="55" r="22" fill="none" stroke="url(#accent)" stroke-width="4" class="progress-line" transform="rotate(-90 280 55)"/>
  </g>

  <g class="floating-card-2" transform="translate(860, 185)">
    <rect width="290" height="120" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    <rect x="20" y="22" width="60" height="8" rx="4" fill="#38bdf8"/>
    <rect x="20" y="40" width="190" height="10" rx="5" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="20" y="58" width="140" height="8" rx="4" fill="#94a3b8" fill-opacity="0.5"/>
    <!-- Status pill -->
    <rect x="20" y="80" width="90" height="22" rx="11" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1"/>
    <text x="65" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#4ade80">IN SPRINT</text>
  </g>

  <!-- Foreground Content: Pill Badge -->
  <g transform="translate(80, 65)">
    <rect width="260" height="32" rx="16" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
    <text x="130" y="21" text-anchor="middle" class="badge-text">⚡ CURATED AGILE ECOSYSTEM</text>
  </g>

  <!-- Main Title in Foreground -->
  <text x="80" y="155" class="title">Awesome Agile Work Management 🚀</text>

  <!-- Subtitle in Foreground -->
  <text x="80" y="205" class="subtitle">Sprint Planning • Kanban Boards • Backlog Management • Team Collaboration</text>

  <!-- Feature Pills under Subtitle -->
  <g transform="translate(80, 245)">
    <!-- SaaS Pill -->
    <rect x="0" y="0" width="140" height="36" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="70" y="23" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🏢 SaaS Platforms</text>

    <!-- Open Source Pill -->
    <rect x="152" y="0" width="165" height="36" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="234" y="23" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🔓 Open-Source Tools</text>

    <!-- Metrics Pill -->
    <rect x="329" y="0" width="175" height="36" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="416" y="23" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">📊 Market & Star Metrics</text>
  </g>

  <!-- Accent Bottom Border Line -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#accent)"/>
</svg>
